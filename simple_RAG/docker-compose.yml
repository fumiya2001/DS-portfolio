version: '3.8'
services:
  db:
    image: ankane/pgvector
    restart: always
    environment:
      POSTGRES_USER: simple_rag_user
      POSTGRES_PASSWORD: simple_rag_user_pw
      POSTGRES_DB: simple_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
